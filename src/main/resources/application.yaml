spring:
  application:
    name: Hotel-Booking
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "http://localhost:8080/Tu/login/oauth2/code/google"
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_nationalized_character_data: true
    database-platform: org.hibernate.dialect.SQLServerDialect

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  task:
    scheduling:
      pool:
        size: 2

server:
  port: 8080
  servlet:
    context-path: /Tu
  tomcat:
    uri-encoding: UTF-8

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha

jwt:
  signerKey: ${JWT_SIGNER_KEY}
  valid-duration: 3600
  refreshable-duration: 36000

vnpay:
  tmn-code: ${VNPAY_TMN_CODE}
  hash-secret: ${VNPAY_HASH_SECRET}
  url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url: http://localhost:5173/payment/vnpay-return
  version: 2.1.0
  command: pay
  order-type: other
  locale: vn
  currency-code: VND

app:
  oauth2:
    redirect-uri: http://localhost:5173/oauth2/callback